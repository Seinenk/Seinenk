# Atualiza os cartões dinâmicos do perfil: atividade no GitHub e a cobrinha das contribuições.
# Os SVGs gerados ficam no ramo "output", que o README lê; a main não recebe commits automáticos.
name: Perfil

on:
  schedule:
    - cron: '41 9 * * *' # todo dia, 06:41 no horário do Piauí
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/**'
      - '.github/workflows/perfil.yml'

permissions:
  contents: write

concurrency:
  group: perfil
  cancel-in-progress: true

jobs:
  cartoes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Cartão de atividade
        run: node .github/scripts/atividade.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USUARIO: ${{ github.repository_owner }}
          SAIDA: dist

      - name: Cobrinha das contribuições
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?palette=github-light&color_snake=#8A7875&color_dots=#EBEBEB,#DCD2CC,#B5A8A3,#8A7875,#393F4A
            dist/snake-dark.svg?palette=github-dark&color_snake=#DCD2CC&color_dots=#21222D,#393F4A,#5E5660,#8A7875,#DCD2CC

      - name: Publicar no ramo output
        working-directory: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b output
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -q -m 'Atualiza os cartões do perfil'
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
